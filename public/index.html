<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZanJewelry Atelier | Fine Jewellery & Cosmetics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--blush:#F4DCD2;--blush-soft:#F9EDE7;--ink:#17120F;--ink-70:#4a3f38;--ink-50:#7a6c63;--tile:#F7F3F0;--line:#eee2dc;--serif:"Cormorant Garamond",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.brand-name{font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.05}
.brand-name small{display:block;font-size:.52rem;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-50)}
.main-nav{display:flex;gap:18px;margin:0 auto}
.main-nav a{text-decoration:none;font-size:.88rem;font-weight:500;color:var(--ink);padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}
.main-nav a:hover{border-color:var(--ink)}
.wa-pill{display:inline-block;text-decoration:none;font-size:.8rem;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:9px 20px}
.wa-pill:hover{background:var(--ink);color:var(--blush)}
.hero{position:relative;min-height:520px;display:flex;align-items:center;background:linear-gradient(120deg,#17120F,#3a2c24 55%,#8a6a58);overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,18,15,.78),rgba(23,18,15,.22))}
.hero-content{position:relative;z-index:2;padding:90px 0}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--blush)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.3rem,5vw,4rem);line-height:1.06;margin:14px 0 16px;color:#fff;max-width:18ch}
.hero p{color:rgba(255,255,255,.9);max-width:52ch}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 28px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;text-align:center}
.btn-dark{background:var(--ink);color:var(--blush)}.btn-dark:hover{background:#000}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{border-color:#fff;color:#fff}.btn-ghost:hover{background:#fff;color:var(--ink)}
.section{padding:56px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,3.4vw,2.6rem);text-transform:uppercase;letter-spacing:.03em}
.crumbs{font-size:.78rem;color:var(--ink-50);margin-bottom:10px}
.crumbs a{color:var(--ink-70);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.page-banner{position:relative;min-height:230px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;background:linear-gradient(140deg,var(--blush-soft),var(--blush));margin-bottom:26px}
.page-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,18,15,.05),rgba(23,18,15,.62))}
.pb-txt{position:relative;z-index:1;color:#fff;padding:26px}
.pb-txt h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.05}
.pb-txt p{opacity:.88;max-width:60ch}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.chip{font:inherit;font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-70);cursor:pointer;text-decoration:none;display:inline-block}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--blush)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{cursor:pointer;display:flex;flex-direction:column;position:relative}
.card-img{aspect-ratio:1/1;background:var(--blush-soft);border-radius:6px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card h3{font-weight:500;font-size:1.02rem;margin-top:12px}
.range{font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);margin-top:5px}
.price{font-size:.9rem;font-weight:600;color:var(--ink-70);margin:4px 0 10px}
.btn-block{display:block;width:100%;padding:11px 10px;font-size:.64rem;margin-top:auto}
.flag{position:absolute;top:10px;left:10px;z-index:2;font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--blush)}
.flag.sold{background:#7a2c26}.flag.oos{background:#8a7a52}
.strips{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.strips::-webkit-scrollbar{display:none}
.strips .card{flex:0 0 250px}
.cat-groups{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.group h3{font-family:var(--serif);font-size:1.5rem;margin-bottom:14px}
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cat-card{flex:0 0 250px;text-decoration:none;color:inherit}
.cat-img{aspect-ratio:1/1.05;background:var(--blush-soft);border-radius:6px;overflow:hidden}
.cat-img img{width:100%;height:100%;object-fit:cover}
.cat-card h3{font-weight:500;font-size:1.1rem;margin-top:12px}
.dash{width:26px;height:2px;background:var(--ink);margin:8px 0}
.cat-card p{color:var(--ink-70);font-size:.88rem}
.empty{color:var(--ink-50);grid-column:1/-1;padding:30px 0}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
form.panel{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:14px;padding:28px;background:var(--blush-soft)}
form.panel label{display:flex;flex-direction:column;gap:6px;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-70)}
input,textarea,select{font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
.site-footer{background:var(--ink);color:var(--blush);padding:40px 0;margin-top:40px}
.site-footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.site-footer strong{font-family:var(--serif);font-size:1.3rem}
.site-footer a{color:var(--blush);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;opacity:.85}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:rgba(23,18,15,.55)}
.modal.open{display:grid}
.modal-card{position:relative;width:100%;max-width:780px;max-height:88vh;overflow-y:auto;background:var(--blush-soft);border-radius:14px;padding:28px}
.close-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;z-index:2}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.detail .main-img{aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--blush-soft);width:100%}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;background:var(--blush-soft)}
.thumbs img.on{border-color:var(--ink)}
.detail h2{font-family:var(--serif);font-size:1.8rem;margin:6px 0}
.detail .price{font-weight:600;margin-bottom:12px}
.muted{color:var(--ink-70)}
.ref{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50)}
.wa-float{position:fixed;right:16px;bottom:16px;z-index:70;background:#25D366;color:#fff;text-decoration:none;font-weight:700;font-size:.8rem;padding:14px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- Ring Customizer ---------- */
.cz-grid{display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:start}
.cz-step{font-family:var(--serif);font-size:1.4rem;margin:26px 0 12px}
.cz-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.big.on{border-color:var(--ink);background:var(--blush-soft)}
.big span{color:var(--ink-70);font-size:.85rem}
.cz-styles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cz-styles .big img{aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--blush-soft);width:100%}
.cz-styles .big strong{font-size:.9rem}
.cz-summary .card{padding:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}.cat-groups,.contact-grid,.detail,.cz-grid,.cz-two{grid-template-columns:1fr}.gcards{grid-template-columns:1fr 1fr}.cz-styles{grid-template-columns:repeat(2,1fr)}.main-nav{display:none}}
</style>
</head>
<body>

<header class="site-header"><div class="wrap header-in">
  <a class="brand" href="#/">
    <img id="brandLogo" alt="" hidden>
    <span class="brand-name">ZanJewelry<small>Manufacturing · Est. 2021</small></span>
  </a>
  <nav class="main-nav">
    <a href="#/shop/jewellery">Jewellery</a>
    <a href="#/shop/rings">Rings</a>
    <a href="#/shop/engagement">Engagement</a>
    <a href="#/shop/wedding">Wedding</a>
    <a href="#/shop/cosmetics">Cosmetics</a>
    <a href="#/customizer">Customize Your Ring</a>
    <a href="#/" onclick="setTimeout(()=>document.getElementById('contact')?.scrollIntoView({behavior:'smooth'}),60)">Contact</a>
  </nav>
  <a class="wa-pill" data-wa="Hi ZanJewelry! I'd like to enquire." target="_blank" rel="noopener">WhatsApp</a>
</div></header>

<div id="app"></div>

<footer class="site-footer"><div class="wrap">
  <div><strong>ZanJewelry Atelier</strong><p style="opacity:.65;font-size:.86rem">Fine jewellery and cosmetics · Est. 2021</p></div>
  <a href="/admin">Admin Portal</a>
</div></footer>

<a class="wa-float" data-wa="Hi ZanJewelry! I'd like to enquire." target="_blank" rel="noopener">WhatsApp us</a>

<div class="modal" id="productModal"><div class="modal-card">
  <button class="close-x" onclick="closeModal()">✕</button>
  <div id="productDetail"></div>
</div></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAT={none:"",gold:"Gold",silver:"Silver","rose-gold":"Rose Gold",platinum:"Platinum",diamond:"Diamond",gemstone:"Gemstone"};
const PLACE=l=>"data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="#F9EDE7"/><text x="50%" y="54%" font-family="Georgia,serif" font-size="180" fill="#17120F" text-anchor="middle" dominant-baseline="middle">'+esc(l||"Z")+'</text></svg>');
const imgFail=im=>{im.onerror=null;im.src=PLACE(im.dataset.letter||"Z");};
const imgFor=p=>{const s=String((p.images&&p.images[0])||p.image||"");return (/^https?:/.test(s)||s.startsWith("/"))?s:(s?"images/"+s.replace(/^\//,""):"");};

let WA="27703887170",products=[],categories=[],content={hero:{},banners:{}},cust=null;
let view={slug:null,material:"All",sub:"All"};
const wa=t=>"https://wa.me/"+WA+"?text="+encodeURIComponent(t);
const catOf=s=>categories.find(c=>c.slug===s);
const pathOf=s=>{const out=[];let c=catOf(s),g=0;while(c&&g++<8){out.unshift(c);c=catOf(c.parent);}return out;};
const inCat=(p,slug)=>p.category===slug||pathOf(p.category).some(c=>c.slug===slug);

function cardHTML(p){
  const img=imgFor(p)||PLACE((p.name||"Z")[0]);
  const label=[(p.path||[]).map(x=>x.name).join(" · "),MAT[p.material]||""].filter(Boolean).join(" · ");
  const flag=p.stockStatus==="sold"?'<span class="flag sold">Sold</span>':p.stockStatus==="out-of-stock"?'<span class="flag oos">Out of stock</span>':"";
  return `<article class="card" data-id="${esc(p.id)}">${flag}
    <div class="card-img"><img src="${esc(img)}" data-letter="${esc((p.name||"Z")[0])}" loading="lazy" alt="${esc(p.name)}" onerror="imgFail(this)"></div>
    <div class="range">${esc(label)}</div><h3>${esc(p.name)}</h3>
    <a class="btn btn-dark btn-block" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="${wa(`Hi ZanJewelry! I'm interested in ${p.name} (Ref ${p.reference}). Is it available?`)}">Enquire on WhatsApp</a>
  </article>`;
}

function renderHome(){
  const h=content.hero||{};
  const feat=products.filter(p=>p.featured).slice(0,8);
  const latest=products.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,8);
  const group=(hub,title)=>{
    const kids=categories.filter(c=>c.parent===hub&&c.active!==false);
    if(!kids.length)return"";
    return `<div class="group"><h3>${esc(title)}</h3><div class="gcards">${kids.map(c=>{
      const img=products.filter(p=>inCat(p,c.slug)).map(imgFor).find(Boolean)||"";
      return `<a class="cat-card" href="#/shop/${c.slug}">
        <div class="cat-img"><img src="${esc(img||PLACE(c.name[0]))}" data-letter="${esc(c.name[0])}" alt="${esc(c.name)}" onerror="imgFail(this)"></div>
        <h3>${esc(c.name)}</h3><div class="dash"></div><p>${esc(c.description||"")}</p></a>`;
    }).join("")}</div></div>`;
  };
  const showCz=cust&&cust.enabled!==false;
  $("#app").innerHTML=`
  <section class="hero">
    ${h.image?`<img class="hero-bg" src="${esc(h.image)}" alt="" onerror="this.remove()">`:""}
    <div class="hero-overlay"></div>
    <div class="wrap hero-content">
      <p class="eyebrow">${esc(h.eyebrow||"ZanJewelry Manufacturing · Est. 2021")}</p>
      <h1>${esc(h.heading||"Rings for your moments. Beauty for your every day.")}</h1>
      <p>${esc(h.sub||"")}</p>
      <div class="hero-actions">
        ${h.ctaText?`<a class="btn btn-white" href="${esc(h.ctaLink||"#/shop/rings")}">${esc(h.ctaText)}</a>`:""}
        ${h.cta2Text?`<a class="btn btn-ghost" href="${esc(h.cta2Link||"#/shop/cosmetics")}">${esc(h.cta2Text)}</a>`:""}
        ${showCz?`<a class="btn btn-ghost" href="#/customizer">Customize Your Ring</a>`:""}
      </div>
    </div>
  </section>
  <main>
    ${feat.length?`<section class="section wrap"><div class="sec-head"><h2>Featured</h2></div><div class="strips">${feat.map(cardHTML).join("")}</div></section>`:""}
    <section class="section wrap" style="padding-top:20px"><div class="cat-groups">${group("jewellery","Shop Jewellery")}${group("cosmetics","Shop Cosmetics")}</div></section>
    <section class="section wrap" style="padding-top:0"><div class="sec-head"><h2>The Latest</h2><a class="chip" href="#/shop/jewellery">View all</a></div>
      <div class="grid">${latest.map(cardHTML).join("")||'<p class="empty">Nothing yet — post your first piece from the admin portal.</p>'}</div></section>
    <section class="section wrap" id="contact"><div class="contact-grid">
      <div><p class="eyebrow" style="color:var(--ink-50)">Contact</p><h2 style="font-family:var(--serif);font-size:2rem">Enquiries & orders</h2>
        <p class="muted">Send the form and it opens WhatsApp with your message ready.</p></div>
      <form class="panel" id="contactForm">
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Message <textarea name="message" rows="4" required></textarea></label>
        <button class="btn btn-dark" type="submit">Send via WhatsApp</button>
      </form>
    </div></section>
  </main>`;
  $("#contactForm").addEventListener("submit",e=>{
    e.preventDefault();const g=n=>e.target.elements[n].value.trim();
    window.open(wa(`Hi ZanJewelry! My name is ${g("name")}. ${g("message")} (Reply to: ${g("email")})`),"_blank");
  });
}

function renderCategory(slug){
  const cat=catOf(slug);
  if(!cat||cat.active===false){$("#app").innerHTML='<section class="section wrap"><h1 style="font-family:var(--serif)">Page not found</h1><p class="muted"><a href="#/">Back to home</a></p></section>';return;}
  view={slug,material:"All",sub:"All"};
  drawCategory();
}

function drawCategory(){
  const cat=catOf(view.slug);
  const crumb=pathOf(view.slug);
  const bn=(content.banners||{})[view.slug]||{};
  const kids=categories.filter(c=>c.parent===view.slug&&c.active!==false);
  const scope=products.filter(p=>inCat(p,view.slug));
  const isJewellery=cat.productType==="jewellery";
  const subs=[...new Set(scope.map(p=>p.subcategory).filter(Boolean))];
  let list=scope;
  if(isJewellery&&view.material!=="All")list=list.filter(p=>p.material===view.material);
  if(view.sub!=="All")list=list.filter(p=>p.subcategory===view.sub);

  const chips=[
    ...kids.map(c=>`<a class="chip" href="#/shop/${c.slug}">${esc(c.name)}</a>`),
    ...(isJewellery?["All","gold","silver","rose-gold","platinum","diamond","gemstone"].map(m=>
      `<button class="chip ${view.material===m?"active":""}" data-mat="${m}">${m==="All"?"All":MAT[m]}</button>`):[]),
    ...subs.map(s=>`<button class="chip ${view.sub===s?"active":""}" data-sub="${esc(s)}">${esc(s)}</button>`)
  ].join("");

  $("#app").innerHTML=`
  <section class="section wrap" style="padding-top:28px">
    <p class="crumbs"><a href="#/">Home</a>${crumb.map(c=>` / <a href="#/shop/${c.slug}">${esc(c.name)}</a>`).join("")}</p>
    <div class="page-banner">
      ${bn.image?`<img src="${esc(bn.image)}" alt="" onerror="this.remove()">`:""}
      <div class="pb-txt"><h1>${esc(bn.title||cat.name)}</h1><p>${esc(bn.description||cat.description||"")}</p></div>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:""}
    <div class="grid">${list.map(cardHTML).join("")||'<p class="empty">Nothing here yet — check back soon.</p>'}</div>
  </section>`;

  document.querySelectorAll("[data-mat]").forEach(b=>b.addEventListener("click",()=>{view.material=b.dataset.mat;drawCategory();}));
  document.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>{view.sub=b.dataset.sub;drawCategory();}));
}

function openProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const imgs=(p.images&&p.images.length?p.images:[""]).filter(Boolean);
  const label=[(p.path||[]).map(x=>x.name).join(" · "),MAT[p.material]||"",p.gemstone?p.gemstone[0].toUpperCase()+p.gemstone.slice(1):""].filter(Boolean).join(" · ");
  $("#productDetail").innerHTML=`<div class="detail">
    <div><img class="main-img" id="pdMain" src="${esc(imgFor(p)||PLACE((p.name||"Z")[0]))}" onerror="imgFail(this)" data-letter="${esc((p.name||"Z")[0])}">
      ${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>`<img src="${esc(s)}" class="${i===0?"on":""}" onclick="document.getElementById('pdMain').src='${esc(s)}';document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('on'));this.classList.add('on')">`).join("")}</div>`:""}
    </div>
    <div><div class="range">${esc(label)}</div><h2>${esc(p.name)}</h2>
      <div class="ref">Ref ${esc(p.reference||"")}</div>
      <div class="price">${p.stockStatus==="sold"?"Sold":p.stockStatus==="out-of-stock"?"Out of stock":"In stock"}</div>
      <p class="muted" style="margin-bottom:18px">${esc(p.description||"")}</p>
      <a class="btn btn-dark" target="_blank" rel="noopener" href="${wa(`Hi ZanJewelry! I'd like more details on ${p.name} (Ref ${p.reference}).`)}">Enquire on WhatsApp</a></div>
  </div>`;
  $("#productModal").classList.add("open");document.body.style.overflow="hidden";
}
function closeModal(){$("#productModal").classList.remove("open");document.body.style.overflow="";}
document.addEventListener("click",e=>{
  const card=e.target.closest(".card");
  if(card&&card.dataset.id&&!e.target.closest("a")){openProduct(card.dataset.id);return;}
  if(e.target.id==="productModal")closeModal();
});

/* ---------- RING CUSTOMIZER ---------- */
let sel={};
const czFind=(arr,id)=>(cust&&cust[arr]||[]).find(x=>x.id===id);
function czName(k,v){
  if(!v)return"";
  if(k==="type")return czFind("diamondTypes",v)?.name||"";
  if(k==="style")return czFind("styles",v)?.name||"";
  if(k==="metal")return czFind("metals",v)?.name||"";
  return v;
}
function estimate(){
  const t=czFind("diamondTypes",sel.type),s=czFind("styles",sel.style),m=czFind("metals",sel.metal);
  if(!t||!s||!m||t.pricePerCarat==null||s.basePrice==null)return null;
  return Math.round(Number(s.basePrice)+Number(m.surcharge||0)+Number(t.pricePerCarat)*(Number(sel.carat)||0));
}
function chipRow(list,cur,fn,fmt){return list.map(v=>`<button class="chip ${String(cur)===String(v)?"active":""}" data-cz="${fn}" data-v="${esc(v)}">${esc(fmt?fmt(v):v)}</button>`).join("");}
function renderCustomizer(){
  if(!cust||cust.enabled===false){$("#app").innerHTML='<section class="section wrap"><h1 style="font-family:var(--serif)">Customizer coming soon</h1><p class="muted"><a href="#/">Back to home</a></p></section>';return;}
  const types=(cust.diamondTypes||[]).filter(t=>t.active!==false);
  const styles=(cust.styles||[]).filter(s=>s.active!==false);
  const metals=(cust.metals||[]).filter(m=>m.active!==false);
  $("#app").innerHTML=`<section class="section wrap" style="padding-top:28px">
    <p class="crumbs"><a href="#/">Home</a> / Customize Your Ring</p>
    <div class="sec-head"><h2>Customize Your Ring</h2></div>
    <div class="cz-grid"><div>
      <h3 class="cz-step">1 · Choose your diamond</h3>
      <div class="cz-two">${types.map(t=>`<button class="big ${sel.type===t.id?"on":""}" data-cz="type" data-v="${t.id}"><strong>${esc(t.name)}</strong><span>${esc(t.desc||"")}</span></button>`).join("")}</div>
      <h3 class="cz-step">2 · Ring style</h3>
      <div class="cz-styles">${styles.map(s=>`<button class="big ${sel.style===s.id?"on":""}" data-cz="style" data-v="${s.id}"><img src="${esc(s.image||PLACE(s.name[0]))}" data-letter="${esc(s.name[0])}" onerror="imgFail(this)" alt=""><strong>${esc(s.name)}</strong><span>${esc(s.category||"")}</span></button>`).join("")}</div>
      <h3 class="cz-step">3 · Metal</h3>
      <div class="chips">${chipRow(metals.map(m=>m.id),sel.metal,"metal",v=>metals.find(m=>m.id===v).name)}</div>
      <h3 class="cz-step">4 · Diamond shape</h3>
      <div class="chips">${chipRow(cust.shapes||[],sel.shape,"shape")}</div>
      <h3 class="cz-step">5 · Carat</h3>
      <div class="chips">${chipRow((cust.carats||[]).map(String),sel.carat,"carat",v=>v+" ct")}</div>
      <h3 class="cz-step">6 · Quality</h3>
      <p class="muted" style="font-size:.8rem;margin-bottom:6px">Colour</p><div class="chips">${chipRow(cust.colours||[],sel.colour,"colour")}</div>
      <p class="muted" style="font-size:.8rem;margin-bottom:6px">Clarity</p><div class="chips">${chipRow(cust.clarities||[],sel.clarity,"clarity")}</div>
      <p class="muted" style="font-size:.8rem;margin-bottom:6px">Cut</p><div class="chips">${chipRow(cust.cuts||[],sel.cut,"cut")}</div>
      <h3 class="cz-step">7 · Ring size</h3>
      <select id="czSize" style="max-width:220px">${(cust.sizes||[]).map(s=>`<option ${String(sel.size)===String(s)?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <p class="muted" style="font-size:.85rem;margin-top:8px">Don't know your size? <a href="#/" onclick="setTimeout(()=>document.getElementById('contact')?.scrollIntoView({behavior:'smooth'}),60)" style="color:var(--ink)">Contact us</a> — we'll help you measure.</p>
    </div>
    <aside class="cz-summary" id="czSummary"></aside></div></section>`;
  $("#czSize").addEventListener("change",e=>{sel.size=e.target.value;drawSummary();});
  drawSummary();
}
function drawSummary(){
  const el=$("#czSummary");if(!el)return;
  const rows=[["Diamond",czName("type",sel.type)],["Style",czName("style",sel.style)],["Metal",czName("metal",sel.metal)],["Shape",sel.shape],["Carat",sel.carat?sel.carat+" ct":""],["Colour",sel.colour],["Clarity",sel.clarity],["Cut",sel.cut],["Size",sel.size?"US "+sel.size:""]].filter(r=>r[1]);
  const est=estimate();
  el.innerHTML=`<div class="card" style="position:sticky;top:90px">
    <h3 style="font-family:var(--serif);font-size:1.4rem;margin-bottom:8px">Your custom ring</h3>
    ${rows.map(r=>`<p style="font-size:.9rem;margin:6px 0"><b>${r[0]}:</b> ${esc(r[1])}</p>`).join("")||'<p class="muted" style="font-size:.9rem">Start choosing — your spec appears here.</p>'}
    ${est?`<p style="margin-top:10px"><b>Estimated price:</b> R ${est.toLocaleString("en-ZA")}</p>`:""}
    <button class="btn btn-dark btn-block" id="czEnquire" style="margin-top:14px">Enquire on WhatsApp</button></div>`;
  $("#czEnquire").addEventListener("click",()=>{
    const msg="Hello ZanJewelry, I would like to enquire about a custom ring.\n\n"
      +rows.map(r=>`${r[0]}: ${r[1]}`).join("\n")
      +(est?`\nEstimated price: R ${est.toLocaleString("en-ZA")}`:"");
    window.open(wa(msg),"_blank");
  });
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-cz]");if(!b)return;
  sel[b.dataset.cz]=b.dataset.v;renderCustomizer();
});

function route(){
  const m=(location.hash||"#/").match(/^#\/shop\/([\w-]+)/);
  if(m)renderCategory(decodeURIComponent(m[1]));
  else if(location.hash==="#/customizer")renderCustomizer();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

(async()=>{
  try{const cfg=await fetch("/api/config").then(r=>r.json());WA=cfg.whatsapp||WA;}catch(_){}
  document.querySelectorAll("[data-wa]").forEach(a=>a.href=wa(a.dataset.wa));
  const load=async()=>{
    try{
      const [p,c,ct,si,cz]=await Promise.all([
        fetch("/api/products").then(r=>r.json()),
        fetch("/api/categories").then(r=>r.json()),
        fetch("/api/content").then(r=>r.json()),
        fetch("/api/site-images").then(r=>r.json()).catch(()=>({})),
        fetch("/api/customizer").then(r=>r.json()).catch(()=>null)
      ]);
      const changed=JSON.stringify(p)!==JSON.stringify(products);
      products=p;categories=c;content=ct;cust=cz;
      if(si.logo){const l=$("#brandLogo");if(l.src!==si.logo){l.src=si.logo;l.hidden=false;}}
      if((changed&&!location.hash.startsWith("#/customizer"))||!$("#app").innerHTML)route();
    }catch(_){}
  };
  await load();
  setInterval(load,20000);
  window.addEventListener("focus",load);
})();
</script>
</body>
</html>
